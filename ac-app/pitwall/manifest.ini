[ABOUT]
NAME = Pitwall
AUTHOR = Pitwall
VERSION = 0.1
DESCRIPTION = Direzione gara in pista: safety car, virtual safety car, giro di formazione, delta, radio dell'ingegnere e penalita. Legge lo stato pubblicato dal plugin SimHub.

[CORE]
; NONE: lo script parte col gioco e resta vivo anche a finestra chiusa.
; Serve per forza: la direzione gara - giro di formazione, safety car, bandiere, comportamento
; degli avversari - lavora sulle vetture, non sulla finestra. Con LAZY = FULL esisteva solo
; mentre la finestra era aperta, e chiuderla spegneva la gara.
LAZY = NONE

[WINDOW_...]
ID = main
NAME = Pitwall
FUNCTION_MAIN = windowMain
SIZE = 360, 240
PADDING = 8, 8

; Semaforo di partenza e bandiere. La classifica sta nel cruscotto Pitwall HUD, che ha il
; pannello fatto apposta: qui resta solo quello che va guardato nell'istante in cui succede.
[WINDOW_...]
ID = hud
NAME = Pitwall - Bandiere
FUNCTION_MAIN = windowHud
SIZE = 240, 190
PADDING = 10, 10
