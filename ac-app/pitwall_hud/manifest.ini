[ABOUT]
NAME = Pitwall HUD
AUTHOR = Pitwall
VERSION = 1.0
DESCRIPTION = Il cruscotto di gara: classifica, mappa, delta, ERS e pannello dell'ingegnere. Cinque finestre separate, da mettere dove servono.

[CORE]
; NONE: lo script gira col gioco. I pannelli leggono lo stato anche a finestra chiusa, cosi
; quando ne riapri uno trova gia i dati invece di partire vuoto.
LAZY = NONE

; Classifica. A sinistra, in verticale: e la forma che ha in televisione e quella che l'occhio
; si aspetta.
[WINDOW_...]
ID = standings
NAME = Pitwall - Classifica
FUNCTION_MAIN = windowStandings
SIZE = 260, 420
PADDING = 8, 8

; Mappa del circuito con le vetture. A destra.
[WINDOW_...]
ID = map
NAME = Pitwall - Mappa
FUNCTION_MAIN = windowMap
SIZE = 260, 260
PADDING = 8, 8

; Delta sul giro. Al centro, grande: e l'unico numero che si guarda mentre si guida.
[WINDOW_...]
ID = delta
NAME = Pitwall - Delta
FUNCTION_MAIN = windowDelta
SIZE = 300, 150
PADDING = 8, 8

; ERS, DRS e carburante.
[WINDOW_...]
ID = ers
NAME = Pitwall - ERS
FUNCTION_MAIN = windowErs
SIZE = 280, 130
PADDING = 8, 8

; Pannello multifunzione: ingegnere, scenari di strategia, richiesta di sosta.
[WINDOW_...]
ID = pit
NAME = Pitwall - Ingegnere
FUNCTION_MAIN = windowPit
SIZE = 360, 260
PADDING = 8, 8
