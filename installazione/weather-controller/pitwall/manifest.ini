[ABOUT]
NAME = Pitwall
AUTHOR = Pitwall
VERSION = 1.0
DESCRIPTION = Meteo dinamico pilotato dallo script meteo del campionato Pitwall: il tempo cambia durante la sessione secondo la previsione, invece di restare fisso.

; Deve valere 1, e la differenza non e cosmetica.
;
; Con 0 il controller finisce nella sezione "Dynamic" del menu meteo di Content Manager, e li va
; scelto a mano: una scelta globale che ogni preset del campionato cancella, perche caricare un
; preset riscrive la voce del tempo. Con 1 il controller diventa quello predefinito, scelto da
; CONTROLLER= nella configurazione, e viene usato qualunque tempo statico sia selezionato.
; Il tipo di tempo lo riceve e lo ignora: comanda il piano della sessione.
FOLLOWS_SELECTED_WEATHER = 1
FOLLOWS_SELECTED_TEMPERATURE = 0
FOLLOWS_SELECTED_WIND = 0
