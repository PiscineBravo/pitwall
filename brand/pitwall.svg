<!--
  Il marchio di Pitwall.

  E il muretto dei box visto di lato: la linea rossa e il muretto, i tre blocchi sopra sono i
  monitor della squadra. Niente di piu, perche questo segno deve restare leggibile a sedici
  pixel nella barra di SimHub e sull'icona dell'app in pista.

  Le altezze dei tre blocchi sono diverse di proposito: tre blocchi uguali sarebbero una
  staccionata, tre diversi sono un gruppo di persone al lavoro.

  Griglia 64x64. Tutte le misure qui sotto sono ripetute identiche in brand/genera.ps1, che
  produce i PNG: se si cambia una, va cambiata anche la.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#14171C"/>

  <!-- Gli schermi della squadra, di altezza diversa: tre uguali sarebbero una staccionata. -->
  <rect x="14" y="24" width="13" height="10" rx="1.5" fill="#E8ECF2"/>
  <rect x="29" y="19" width="13" height="15" rx="1.5" fill="#E8ECF2"/>
  <rect x="44" y="27" width="9" height="7" rx="1.5" fill="#93A0B0"/>

  <!-- Il muretto: piu largo degli schermi, cosi si legge che ci stanno sopra. -->
  <rect x="8" y="34" width="48" height="8" rx="2" fill="#E10600"/>
</svg>
